# Which dependencies may run install scripts.
#
# pnpm 10 blocks lifecycle scripts by default and prompts instead. Left
# uncommitted, that prompt reappears on every fresh clone and in CI — and
# answering it wrong silently skips `prisma generate`, which surfaces much later
# as `Cannot find module '.prisma/client/default'` rather than as an install
# error. Committing the answers makes installs reproducible.
#
# Generated by `pnpm approve-builds`; re-run it rather than hand-editing.

onlyBuiltDependencies:
  # Downloads and places the query engine binary. Without it there is no
  # generated client, and nothing that touches the database can run.
  - '@prisma/engines'
  - prisma
  # Native Rust binary behind Next's compiler. Falls back to a much slower
  # WASM build when its install script is skipped.
  - '@swc/core'

ignoredBuiltDependencies:
  # All three ship prebuilt binaries for the platforms we use, so their build
  # scripts are redundant here; esbuild and unrs-resolver arrive only as
  # transitive dependencies of tooling.
  - '@parcel/watcher'
  - esbuild
  - unrs-resolver
